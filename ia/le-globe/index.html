<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8" data-k>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" data-k>
<title data-k>Le Globe — carnet de voyages</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-k>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" data-k>
<style data-k>:root{--bg:#05070c;--ink:#EDE6D6;--muted:#9a9faa;--line:rgba(237,230,214,.12);--panel:#0c1018;--panel2:#121825;--gold:#E8B865;--gold-d:#C98A2E;--aqua:#6FE3CF;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
::selection{background:rgba(232,184,101,.35);color:#fff}
body{background:radial-gradient(120% 80% at 50% 0%,#0d1422 0%,#05070c 60%) fixed}
.root{position:fixed;inset:0}
canvas{position:absolute;inset:0;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.placing canvas{cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;vertical-align:-3px}
h1,h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:.005em;margin:0}
.eyebrow{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.top{position:absolute;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 20px 28px;background:linear-gradient(180deg,rgba(5,7,12,.92) 0%,rgba(5,7,12,.7) 60%,rgba(5,7,12,0) 100%);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.brand h1{font-size:40px;line-height:1;margin-top:4px}
.stats{display:flex;gap:18px;text-align:right}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;line-height:1;color:var(--ink)}
.stats b small{font-size:18px;color:var(--gold)}
.stats span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.legend{position:absolute;left:20px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;gap:14px;font-size:12px;color:var(--muted);pointer-events:none}
.legend span{display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot.gold{background:linear-gradient(135deg,#F6D58E,#C98A2E)}.dot.aqua{background:var(--aqua);box-shadow:0 0 8px rgba(111,227,207,.7)}.dot.grey{background:#2c3443;border:1px solid #475066}
.fab{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.round,.pill-btn{height:44px;border-radius:22px;border:1px solid var(--line);background:rgba(12,16,24,.92);display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .15s,background .15s}
.round{width:44px}.pill-btn{padding:0 16px;font-size:14px;font-weight:600}
.round:hover,.pill-btn:hover{border-color:rgba(232,184,101,.5)}
.round svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.5}
.save{position:absolute;top:calc(84px + env(safe-area-inset-top));right:20px;height:36px;padding:0 16px;border-radius:18px;border:0;background:var(--gold);color:#1b1306;font-weight:700;font-size:13px;box-shadow:0 6px 20px rgba(232,184,101,.25);transition:transform .2s var(--ease),opacity .2s}
.save.hidden{opacity:0;pointer-events:none;transform:translateY(-6px)}
.toast{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top));transform:translate(-50%,-10px);background:#141b29;border:1px solid rgba(232,184,101,.35);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s var(--ease);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:64vh;background:var(--panel);border-top:1px solid rgba(232,184,101,.28);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;transform:translateY(105%);transition:transform .5s var(--ease);box-shadow:0 -20px 50px rgba(0,0,0,.5);overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#2b3242;margin:0 auto 10px}
.close{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--panel2);font-size:20px;line-height:1}
.close.static{position:static}
@media (min-width:760px){
  .sheet{left:auto;top:0;width:400px;max-height:none;border-radius:0;border-top:0;border-left:1px solid rgba(232,184,101,.22);transform:translateX(105%);padding-top:calc(28px + env(safe-area-inset-top))}
  .grab{display:none}
}
.c-head{display:flex;gap:14px;align-items:center;margin:4px 40px 18px 0}
.flag{font-size:44px;line-height:1}
.c-head .eyebrow{color:var(--muted);letter-spacing:.16em}
.c-head h2{font-size:34px;line-height:1.05}
.pills{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:10px}
.pill.gold{background:rgba(232,184,101,.15);color:#F2CE85}.pill.aqua{background:rgba(111,227,207,.13);color:var(--aqua)}.pill.grey{background:#1a2130;color:var(--muted)}
.actions{display:flex;gap:10px;margin-bottom:18px}
.btn{height:44px;border-radius:12px;padding:0 16px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel2);transition:transform .12s,background .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1b1306;flex:1}
.btn.primary:hover{background:#F2C676}
.btn.ghost{flex:1}.btn.ghost:hover{border-color:rgba(232,184,101,.45)}
.btn.full{width:100%;margin:6px 0 4px}
.btn.sm{height:40px;flex:0 0 auto}
.btn:disabled{opacity:.6}
.link{background:none;border:0;padding:6px 0;color:var(--gold);font-size:13px;font-weight:600}
.link.danger{color:#E58C7A}
.locked{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;background:repeating-linear-gradient(135deg,#0f1420 0 10px,#111725 10px 20px);border:1px dashed #2c3444}
.lock-ico svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:1.6;margin-top:2px}
.locked p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.trip{border-top:1px solid var(--line);padding-top:16px;margin-top:6px;animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.trip-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.trip-title{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid transparent;font-family:'Instrument Serif',serif;font-size:26px;color:var(--ink);padding:2px 0}
.trip-title:focus{border-bottom-color:var(--gold);outline:none}
.dates{display:flex;gap:10px;margin:10px 0 14px}
.dates label{flex:1;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;gap:4px}
input[type=date],.search,.add-stop input{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:0 12px;font:inherit;font-size:15px;color-scheme:dark;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-bottom:14px}
.kv span{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.kv b{font-weight:600;font-size:15px}
h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:20px 0 8px;font-weight:700}
h4 .muted{letter-spacing:.02em;text-transform:none;font-weight:500}
.muted{color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid rgba(232,184,101,.3)}
.timeline li{position:relative;margin:0 0 12px;font-size:15px;line-height:1.5}
.timeline li::before{content:"";position:absolute;left:-18px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.timeline b{display:block;font-size:12px;color:#F2CE85;letter-spacing:.04em}
.tips{margin:0;padding-left:18px;font-size:15px}.tips li{margin-bottom:6px}
.src{font-size:12px;color:var(--muted);margin-top:10px}
.stops{list-style:none;margin:0 0 10px;padding:0}
.stops li{display:flex;align-items:center;gap:10px;padding:4px 0}
.stops .n{width:24px;height:24px;border-radius:12px;border:1px solid var(--aqua);color:var(--aqua);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stop-name{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;padding:6px 0;border-bottom:1px solid transparent}
.stop-name:focus{outline:none;border-bottom-color:var(--aqua)}
.x{background:none;border:0;color:var(--muted);font-size:20px;width:32px;height:32px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.add-stop{display:flex;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.shimmer{height:14px;border-radius:7px;margin:12px 0;background:linear-gradient(90deg,#141a27 0%,#1f2738 50%,#141a27 100%);background-size:200% 100%;animation:sh 1.3s linear infinite}
.shimmer.s2{width:85%}.shimmer.s3{width:65%}
@keyframes sh{to{background-position:-200% 0}}
/* drawer */
.drawer{position:absolute;inset:0;background:rgba(5,7,12,.97);padding:calc(18px + env(safe-area-inset-top)) 20px 20px;transform:translateY(100%);transition:transform .45s var(--ease);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer h2{font-size:32px}
#drawerBody{flex:1;min-height:0;display:flex;flex-direction:column}
.seg{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
.seg button{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:none;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#0b0e14;border-color:var(--ink)}
.clist{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.clist li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(237,230,214,.06);cursor:pointer}
.clist li:hover{background:rgba(237,230,214,.03)}
.clist .f{font-size:22px;width:28px}
.clist .nm{flex:1;font-size:16px}
.clist small{display:block;color:var(--muted);font-size:12px}
.empty-state{padding:30px 0}
.search::placeholder,.add-stop input::placeholder{color:#8d93a0}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2a3242;border-radius:3px}
@media (max-width:759px){.brand h1{font-size:32px}.stats{gap:12px}.stats b{font-size:24px}.legend{bottom:calc(76px + env(safe-area-inset-bottom));left:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
.trip-foot{margin-top:18px;padding-top:10px;border-top:1px solid rgba(237,230,214,.06)}

.sheet.tall{max-height:72vh}
@media (min-width:760px){.sheet.tall{max-height:none;width:440px}}
.small{font-size:12px}
.trip-card{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;margin-top:12px;padding:14px 16px;border-radius:14px;border:1px solid rgba(111,227,207,.28);background:linear-gradient(135deg,rgba(111,227,207,.08),rgba(111,227,207,0) 70%);transition:border-color .15s,transform .12s}
.trip-card:active{transform:scale(.985)}.trip-card:hover{border-color:rgba(111,227,207,.6)}
.trip-card b{font-family:'Instrument Serif',serif;font-weight:400;font-size:22px;display:block;line-height:1.15}
.trip-card small{color:var(--muted);font-size:13px}
.trip-card .go{flex:0 0 auto;color:var(--aqua);font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.carnet-top{display:flex;align-items:center;margin:0 44px 6px 0}
.back{display:flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;padding:6px 0}
.back:hover{color:var(--ink)}
.seg.mode{margin:8px 0 14px}
.seg.mode button{display:flex;align-items:center;gap:6px;height:36px}
.seg.mode button.on{background:var(--aqua);border-color:var(--aqua);color:#06221d}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tstats div{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column}
.tstats b{font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;line-height:1.1}
.tstats span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.fake{height:42px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;padding:0 12px;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0}
.tabs{position:sticky;top:-10px;z-index:3;display:flex;gap:4px;margin:16px -20px 4px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:13px;font-weight:700}
.tabs button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}
.stops li{gap:8px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;height:32px;flex:0 0 auto}
.stepper button{width:28px;height:30px;border:0;background:none;font-size:17px;color:var(--gold)}
.stepper span{min-width:30px;text-align:center;font-size:13px;font-weight:700}
.stepper.big{height:42px;margin-top:4px;width:max-content}.stepper.big button{width:42px;height:40px;font-size:20px}.stepper.big span{min-width:80px;font-size:15px}
.mv{display:flex;flex-direction:column}
.mv button{width:26px;height:16px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.mv button:disabled{opacity:.25}.mv .ic{width:14px;height:14px}
.suggest{margin-top:12px;padding:14px;border-radius:14px;border:1px solid rgba(232,184,101,.3);background:#0f1420;display:flex;flex-direction:column;gap:12px}
.suggest label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;gap:4px}
.suggest input{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:0 12px;font:inherit;font-size:15px;text-transform:none;letter-spacing:0}
.daystrip{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 14px;padding:2px 20px 6px;scroll-snap-type:x proximity}
.daystrip button{flex:0 0 auto;scroll-snap-align:start;min-width:74px;max-width:120px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left;display:flex;flex-direction:column}
.daystrip b{font-size:13px;color:var(--gold)}
.daystrip span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daystrip button.on{border-color:var(--gold);background:rgba(232,184,101,.1)}.daystrip button.on span{color:var(--ink)}
.timeline2{list-style:none;margin:0;padding:0 0 0 34px;position:relative}
.timeline2::before{content:"";position:absolute;left:13px;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--aqua),rgba(232,184,101,.5))}
.dayc{position:relative;margin-bottom:18px;padding:12px 14px;border-radius:14px;background:#0f1420;border:1px solid rgba(237,230,214,.06);transition:border-color .2s,background .2s;scroll-margin:70px}
.dayc.on{border-color:rgba(232,184,101,.45);background:#121826}
.dnum{position:absolute;left:-34px;top:12px;width:27px;height:27px;border-radius:50%;background:var(--panel);border:1px solid var(--aqua);color:var(--aqua);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.dayc.on .dnum{background:var(--gold);border-color:var(--gold);color:#1b1306}
.leg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:9px;background:rgba(111,227,207,.07);margin-bottom:10px}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{color:var(--aqua);font-weight:700;white-space:nowrap}
.leg.flight{background:rgba(232,184,101,.08)}.leg.flight b{color:#F2CE85}
.dayc .leg:last-child{margin:10px 0 0}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;cursor:pointer}
.dhead b{font-size:15px}.dhead div span{display:block;font-size:12px;color:var(--muted);text-transform:capitalize}
.dhead em{font-style:normal;font-family:'Instrument Serif',serif;font-size:20px;text-align:right}
.dhead em small{font-family:Manrope,sans-serif;font-size:11px;color:var(--muted)}
.acts{list-style:none;margin:8px 0 0;padding:0}
.acts li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.acts li span{flex:1}
.acts li.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(237,230,214,.3)}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid #4a5468;background:none;color:#1b1306;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0}
.done .chk{background:var(--aqua);border-color:var(--aqua);color:#06221d}
.mtag{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-left:8px}
.add-act input{width:100%;height:36px;border:0;border-bottom:1px dashed #2c3444;background:none;color:var(--ink);font:inherit;font-size:14px;padding:0}
.add-act input::placeholder{color:#7f8695}
.add-act input:focus{outline:none;border-bottom-color:var(--gold)}
.musts{list-style:none;margin:0;padding:0}
.must{padding:12px 0;border-bottom:1px solid rgba(237,230,214,.06)}
.must .mt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.must b{font-size:15.5px}
.must p{margin:4px 0 6px;font-size:14px;color:#c8c3b8;line-height:1.45}
.tag{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:7px;background:rgba(111,227,207,.12);color:var(--aqua)}
.tag.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.mact{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.addto{font-size:13px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:4px}
.addto select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;height:30px;font:inherit;font-size:13px;padding:0 6px;color-scheme:dark;max-width:170px}
.stop-name{min-width:0}
.top{transition:opacity .3s,transform .4s var(--ease)}
@media (max-width:759px){.carnet .top{opacity:0;transform:translateY(-20px);pointer-events:none}.carnet .save{top:calc(14px + env(safe-area-inset-top))}}

/* search */
.searchbar{position:absolute;z-index:5;left:16px;right:16px;top:calc(92px + env(safe-area-inset-top));height:46px;border-radius:23px;background:rgba(12,16,24,.94);border:1px solid rgba(237,230,214,.14);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:border-color .2s,box-shadow .3s var(--ease),transform .4s var(--ease),opacity .3s}
.searchbar>svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.6;flex:0 0 auto}
.searchbar.focus{border-color:rgba(232,184,101,.6);box-shadow:0 0 0 4px rgba(232,184,101,.12),0 14px 40px rgba(0,0,0,.5)}
.searchbar.focus>svg{stroke:var(--gold)}
.searchbar input{flex:1;min-width:0;height:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;outline:none}
.searchbar input::placeholder{color:#8d93a0}
.searchbar input::-webkit-search-cancel-button{display:none}
.sq-clear{width:34px;height:34px;border-radius:17px;border:0;background:var(--panel2);color:var(--muted);font-size:18px;opacity:0;pointer-events:none;transition:opacity .15s}
.searchbar.has .sq-clear{opacity:1;pointer-events:auto}
.sres{position:absolute;left:0;right:0;top:54px;max-height:min(60vh,460px);overflow-y:auto;background:#0d121b;border:1px solid rgba(237,230,214,.12);border-radius:18px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.6);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top center;pointer-events:none;transition:opacity .18s,transform .25s var(--ease)}
.sres.open{opacity:1;transform:none;pointer-events:auto}
.s-group{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding:10px 12px 4px;font-weight:700}
.s-row,.s-all{width:100%;display:flex;align-items:center;gap:12px;padding:9px 12px;border:0;border-radius:12px;background:none;text-align:left;animation:sin .3s var(--ease) both}
.s-row:hover,.s-row.sel,.s-all:hover{background:rgba(237,230,214,.06)}
@keyframes sin{from{opacity:0;transform:translateY(4px)}}
.s-flag{font-size:24px;width:30px;text-align:center}
.s-pin{width:30px;height:30px;border-radius:15px;background:rgba(232,184,101,.12);color:var(--gold);display:flex;align-items:center;justify-content:center}
.s-ai .s-pin{background:rgba(111,227,207,.12);color:var(--aqua)}
.s-main{flex:1;min-width:0;display:flex;flex-direction:column}
.s-main b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-main small{font-size:12.5px;color:var(--muted)}
mark{background:none;color:var(--gold);font-weight:800}
.s-all{justify-content:space-between;color:var(--muted);font-size:14px;font-weight:600}
.s-note{padding:12px;color:var(--muted);font-size:13px}
@media (min-width:760px){.searchbar{left:50%;right:auto;width:400px;transform:translateX(-50%);top:calc(22px + env(safe-area-inset-top))}}
@media (max-width:759px){.carnet .searchbar{opacity:0;pointer-events:none;transform:translateY(-20px)}}
.commu-open .searchbar{opacity:0;pointer-events:none}
@media (min-width:760px){.commu-open .searchbar{transform:translateX(-50%)}}
/* community view */
.fab{flex-wrap:wrap;justify-content:flex-end}
.pill-btn.commu{border-color:rgba(111,227,207,.35)}
.commu-view{position:absolute;inset:0;z-index:8;background:#06080d;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .55s var(--ease);padding-top:env(safe-area-inset-top)}
.commu-view.open{transform:none}
@media (min-width:760px){.commu-view{left:auto;width:520px;border-left:1px solid rgba(232,184,101,.2);transform:translateX(100%)}}
.commu-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 6px}
.commu-head h2{font-size:38px;line-height:1.05}
.commu-body{flex:1;overflow-y:auto;padding:6px 20px calc(30px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.ctools{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.ctools .btn.primary{width:100%}
.ctools .seg{margin:0}
.chipf{max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13px;color:var(--muted);background:#0f1420;border:1px dashed #2c3444;border-radius:12px;padding:10px 12px}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.cstats div{background:#06080d;padding:10px 12px;display:flex;flex-direction:column}
.cstats b{font-family:'Instrument Serif',serif;font-weight:400;font-size:28px;line-height:1.1}
.cstats span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.feed{display:flex;flex-direction:column;gap:14px}
.rcard{background:linear-gradient(180deg,#101624,#0c1018);border:1px solid rgba(237,230,214,.08);border-radius:18px;padding:14px 16px 16px;animation:rise .6s var(--ease) both;animation-delay:var(--d)}
.rcard header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.av{--h:40;width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#0b0e14;background:linear-gradient(135deg,hsl(var(--h) 70% 72%),hsl(calc(var(--h) + 40) 60% 55%))}
.who{flex:1;min-width:0;display:flex;flex-direction:column}.who b{font-size:15px}.who small{font-size:12.5px;color:var(--muted)}
.rdest{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid rgba(232,184,101,.18);background:rgba(232,184,101,.05);text-align:left;margin-bottom:12px;transition:border-color .15s,transform .12s}
.rdest:hover{border-color:rgba(232,184,101,.5)}.rdest:active{transform:scale(.985)}
.rflag{font-size:34px;line-height:1}
.rname{flex:1;min-width:0;display:flex;flex-direction:column}
.rname b{font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;line-height:1.05}
.rname small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rscore{display:flex;flex-direction:column;align-items:flex-end}
.rscore b{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;line-height:1;color:#F2CE85}
.stars{position:relative;display:inline-block;font-size:15px;line-height:1;letter-spacing:2px;color:#2c3443}
.stars::before{content:"★★★★★"}
.stars::after{content:"★★★★★";position:absolute;left:0;top:0;width:var(--v);overflow:hidden;white-space:nowrap;color:var(--gold)}
.stars.sm{font-size:11px;letter-spacing:1px}
.crit{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px}
.crit.sm{margin-bottom:10px}
.cr{display:grid;grid-template-columns:78px 1fr 24px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.cr em{font-style:normal;color:var(--ink);font-weight:700;text-align:right}
.bar{height:5px;border-radius:3px;background:#1d2433;overflow:hidden}
.bar b{display:block;height:100%;width:var(--w);border-radius:3px;background:linear-gradient(90deg,#C98A2E,#F6D58E);transform-origin:left;animation:grow .9s var(--ease) both .2s}
@keyframes grow{from{transform:scaleX(0)}}
.rtext{font-size:15px;line-height:1.55;margin:4px 0 2px;white-space:pre-line;color:#e4ddcd}
.rtext.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{padding:2px 0}
.rtips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.rt-l{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--aqua);margin-right:4px}
.chip{font-size:13px;padding:5px 10px;border-radius:14px;background:rgba(111,227,207,.08);border:1px solid rgba(111,227,207,.22)}
.cavg{display:flex;gap:16px;align-items:center;padding:14px;border-radius:16px;background:#0f1420;border:1px solid rgba(237,230,214,.07);margin-bottom:14px}
.cavg .big{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;min-width:74px}
.cavg .big b{font-family:'Instrument Serif',serif;font-weight:400;font-size:44px;line-height:1;color:#F2CE85}
.cavg .big small{font-size:12px;color:var(--muted)}
.cavg .crit{flex:1;grid-template-columns:1fr}
.cbanner{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;margin:-4px 0 14px;border-radius:14px;border:1px solid rgba(111,227,207,.3);background:linear-gradient(90deg,rgba(111,227,207,.1),rgba(111,227,207,.02));text-align:left;animation:rise .5s var(--ease) both}
.cbanner span:not(.av){flex:1;min-width:0;display:flex;flex-direction:column}
.cbanner b{font-size:14.5px;font-weight:600}.cbanner small{font-size:12.5px;color:var(--aqua)}
.cbanner>.ic{color:var(--muted)}
.cinvite{width:100%;margin-top:14px;padding:12px 14px;border-radius:12px;border:1px dashed #2c3444;background:none;text-align:left;font-size:14px;color:var(--muted)}
.cinvite b{color:var(--gold);font-weight:600}
.csec{margin-top:6px}
/* review form */
.rform{display:flex;flex-direction:column;gap:16px;animation:rise .45s var(--ease) both}
.rform h3{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;margin:0}
.fl{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.fl small{text-transform:none;letter-spacing:0;font-weight:500}
.fl input,.fl textarea{border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:11px 12px;font:inherit;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color-scheme:dark;resize:vertical}
.fl input{height:46px}
.fl input:focus,.fl textarea:focus{outline:none;border-color:rgba(232,184,101,.6)}
.frow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.fsugg{display:flex;flex-direction:column}
.fsugg button{display:flex;gap:10px;align-items:center;padding:9px 6px;border:0;background:none;text-align:left;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;border-bottom:1px solid rgba(237,230,214,.06)}
.fsugg span{font-size:20px}
.picked{display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 12px;border-radius:12px;border:1px solid rgba(232,184,101,.45);background:rgba(232,184,101,.07);text-transform:none;letter-spacing:0}
.picked span{font-size:26px}.picked b{flex:1;font-family:'Instrument Serif',serif;font-weight:400;font-size:22px;color:var(--ink)}
.rate{display:flex;flex-direction:column;gap:2px;padding:4px 12px;border-radius:14px;background:#0f1420;border:1px solid rgba(237,230,214,.07);text-transform:none;letter-spacing:0}
.rrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(237,230,214,.05)}
.rrow:last-child{border-bottom:0}
.rrow>span{font-size:15px;color:var(--ink);font-weight:500}
.rstars{display:flex;gap:2px}
.rstars button{width:36px;height:36px;border:0;background:none;padding:5px;display:flex}
.rstars svg{width:100%;height:100%;fill:#232a39;stroke:#39425a;stroke-width:1;transition:fill .15s,stroke .15s,transform .2s var(--ease)}
.rstars button.on svg{fill:var(--gold);stroke:#F6D58E}
.rstars button.pop svg{animation:spop .45s var(--ease)}
@keyframes spop{0%{transform:scale(.6) rotate(-15deg)}60%{transform:scale(1.3) rotate(6deg)}100%{transform:none}}
.rform .link.danger{align-self:flex-start}
.eyebrow,.stats span{white-space:nowrap}
@media (max-width:759px){.stats{gap:14px}.stats span{font-size:10.5px;letter-spacing:.03em}}
.ctools .btn{flex:none;height:46px}

cv.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId); const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2 && pinch0){const p=[...pointers.values()]; const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); view.k=Math.max(0.7,Math.min(40,pinch0.k*d/pinch0.d)); moved+=10; return;}
  moved+=Math.abs(dx)+Math.abs(dy);
  const s=70/(R0*view.k);
  view.lon+=dx*s; view.lat=Math.max(-85,Math.min(85,view.lat-dy*s));
  vel={x:dx*s,y:-dy*s}; lastMove=performance.now(); lastInteract=lastMove;
});
function up(e){
  pointers.delete(e.pointerId); if(pointers.size<2) pinch0=null;
  if(pointers.size===0){ dragging=false; if(performance.now()-lastMove>60) vel={x:0,y:0};
    if(moved<8) handleTap(e.clientX,e.clientY); }
}
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault(); target=null; view.k=Math.max(0.7,Math.min(40,view.k*Math.exp(-e.deltaY*0.0015))); lastInteract=performance.now();},{passive:false});

let placingStop=null; // trip id when placing a stop by tap
function handleTap(x,y){
  applyProj();
  if(placingStop){
    const ll=proj.invert([x,y]); if(!ll) return;
    const trip=state.trips.find(t=>t.id===placingStop); placingStop=null; root.classList.remove('placing');
    if(trip){ addStop(trip,{name:trip._pending||('Étape '+(trip.stops.length+1)), lat:+ll[1].toFixed(4), lon:+ll[0].toFixed(4)}); delete trip._pending; touch(); renderSheet(); toast('Étape ajoutée ✦'); }
    return;
  }
  // tiny-country markers first
  const vs=visitedSet(), ps=plannedSet(); const c=[-view.lon,-view.lat];
  let best=null,bd=18;
  FEATS.forEach(f=>{ if(!f.tiny) return; if(d3.geoDistance(f.cent,c)>Math.PI/2) return; const p=proj(f.cent); const d=Math.hypot(p[0]-x,p[1]-y); if(d<bd){bd=d;best=f;} });
  if(!best){ const ll=proj.invert([x,y]); if(ll && d3.geoDistance(ll,c)<Math.PI/2){ best=FEATS.find(f=>{const b=f.bounds; return d3.geoContains(f,ll);}); } }
  if(best) select(best.id); else if(selected) closeSheet();
}

let selected=null, popT=0, popStart=0, sheetOpen=false;
function focusOn(id){
  const f=BY_ID[id]; if(!f) return;
  const b=f.bounds; let dl=b[1][0]-b[0][0]; if(dl<0) dl+=360;
  const midLat=(b[0][1]+b[1][1])/2;
  let span=Math.max(dl*Math.cos(midLat*Math.PI/180), b[1][1]-b[0][1]);
  if(f.tiny) span=Math.max(span,1.2);
  span=Math.max(span,0.8)*Math.PI/180;
  const minDim=isMobile()? Math.min(W,H*0.42) : Math.min(W-400,H);
  let k=(0.42*minDim/span)/R0; k=Math.max(1,Math.min(9,k));
  if(dl>200) k=1;
  tweenTo(-f.cent[0], -f.cent[1], k, 1200, isMobile()?0.3:0.5);
}
function select(id,keepCity){
  if(!keepCity) cityMark=null;
  if(selected!==id){ selected=id; popStart=performance.now()+500; ui.trip=null; ui.suggest=null; }
  focusOn(id); openSheet(); renderSheet();
}

function closeSheet(){ sheetOpen=false; selected=null; cityMark=null; ui.trip=null; ui.suggest=null; $('#sheet').classList.remove('tall'); root.classList.remove('carnet'); placingStop=null; root.classList.remove('placing'); $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden','true'); tweenTo(view.lon,view.lat,Math.min(view.k,1.15),900,0.5); }

function hav(a,b){ return d3.geoDistance([a.lon,a.lat],[b.lon,b.lat])*6371; }
function fmtH(h){ const m=Math.round(h*60/10)*10; const H=Math.floor(m/60), M=m%60; return H?(H+' h'+(M?' '+String(M).padStart(2,'0'):'')):M+' min'; }
function addDays(s,n){ const d=new Date(s+'T12:00'); d.setDate(d.getDate()+n); return d; }
function dayLabel(d){ return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}); }
function normTrip(t){
  t.mode=t.mode||'road'; t.stops=t.stops||[];
  t.stops.forEach(s=>{ s.id=s.id||uid(); s.n=Math.max(1,s.n|| (s.nights)||1); s.days=s.days||[];
    while(s.days.length<s.n) s.days.push([]);
    if(s.days.length>s.n){ const extra=s.days.splice(s.n).flat(); s.days[s.n-1].push(...extra); } });
  return t;
}
state.trips.forEach(normTrip);
function legs(t){
  // travel arriving at each stop + return
  const out=[]; let prev=HOME;
  t.stops.forEach((s,i)=>{ const km=hav(prev,s);
    if(i===0) out.push({type:km>350?'flight':'drive',km:km>350?km:km*1.25,from:HOME.name,to:s.name});
    else if(t.mode==='city') out.push({type:km>60?'drive':'walk',km:km>60?km*1.25:km*1.2,from:prev.name,to:s.name});
    else out.push({type:'drive',km:km*1.25,from:prev.name,to:s.name});
    prev=s; });
  const last=t.stops[t.stops.length-1]; if(last){ const km=hav(last,HOME); out.push({type:km>350?'flight':'drive',km:km>350?km:km*1.25,from:last.name,to:HOME.name,ret:true}); }
  out.forEach(l=>{ l.h = l.type==='flight'? l.km/750+0.6 : l.type==='walk'? l.km/4.5 : l.km/72; });
  return out;
}
function buildDays(t){
  const L=legs(t), days=[]; let n=0;
  t.stops.forEach((s,i)=>{ for(let j=0;j<s.n;j++){ days.push({num:n+1,date:t.start?addDays(t.start,n):null,stop:s,si:i,di:j,leg:j===0?L[i]:null}); n++; } });
  if(days.length && L.length) days[days.length-1].ret=L[L.length-1];
  return days;
}
function tripStats(t){ const L=legs(t); const road=L.filter(l=>l.type!=='flight').reduce((a,l)=>a+l.km,0); return {days:t.stops.reduce((a,s)=>a+s.n,0), stops:t.stops.length, road, flight:L.filter(l=>l.type==='flight').length}; }

    <p class="src">Synthèse générée par Claude — à recouper avant de partir. <button class="link" data-act="loadInfo" data-trip="${t.id}">Régénérer</button></p>`;
  else if(sampleCap) b=`<button class="btn ghost full" data-act="loadInfo" data-trip="${t.id}">Charger religions & histoire</button>`;
  else b=`<p class="muted">Religions & histoire : disponibles quand la page est ouverte dans Claude.</p>`;

}

async function geocodeAdd(trip,q){

async function askJSON(prompt,tier){

async function suggest(trip,n,envies){
  const i=INFO[trip.country]; trip._sugLoading=true; renderSheet();
  try{
    const r=await askJSON(`Tu es un concepteur de voyages sur mesure, réaliste sur les temps de trajet. Pays : ${i.en}. Départ et retour : Paris (en avion si loin).

Propose les étapes dans l'ordre logique. La somme des "jours" doit faire exactement ${n}. Pour chaque étape, propose 2 à 4 activités réparties par jour.

function fitRoute(trip){
  const pts=[[HOME.lon,HOME.lat],...trip.stops.map(s=>[s.lon,s.lat])];
  const fp=trip.stops.length?trip.stops.map(s=>[s.lon,s.lat]):pts; const c=d3.geoCentroid({type:'MultiPoint',coordinates:fp});
  let maxd=0; fp.forEach(p=>maxd=Math.max(maxd,d3.geoDistance(p,c)));
  const tall=$('#sheet').classList.contains('tall');
  const minDim=isMobile()? Math.min(W,H*(tall?0.3:0.42)) : Math.min(W-400,H);
  let k=Math.max(1,Math.min(trip.mode==='city'?40:28,(0.36*minDim/Math.max(maxd,0.004))/R0));
  tweenTo(-c[0],-c[1],k,1300,isMobile()?(tall?0.17:0.3):0.5);
}

/* ---------- search (countries + cities) ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/[^a-z0-9]+/g,' ').trim();
let CITIES=null, citiesLoading=null, cityMark=null;
function loadCities(){
  if(CITIES||citiesLoading) return citiesLoading;
  citiesLoading=fetch('cities.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(a=>{
    CITIES=a.map(c=>({n:c[0],lon:c[1],lat:c[2],cid:c[3],pop:c[4],fr:c[5]||null,k:norm(c[0]),kf:c[5]?norm(c[5]):null}));
    if(sq.value) doSearch();
  }).catch(()=>{ CITIES=[]; });
  return citiesLoading;
}
const COUNTRY_KEYS=Object.entries(INFO).filter(([id])=>BY_ID[id]).map(([id,i])=>({id,i,k:norm(i.n),ke:norm(i.en)}));
const sq=$('#sq'), sres=$('#sres');
let sResults=[], sSel=-1;
function scoreName(k,q){ if(!k) return 9; if(k===q) return 0; if(k.startsWith(q)) return 1; if(k.includes(' '+q)) return 2; if(q.length>=3&&k.includes(q)) return 3; return 9; }
function hl(name,q){
  const nn=norm(name); const i=nn.indexOf(q);
  if(i<0 || nn.length!==name.normalize('NFD').replace(/\p{M}/gu,'').length) return esc(name);
  return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length));
}
function fmtPop(k){ return k>=1000? (k/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' M hab.' : k>0? k+' k hab.' : ''; }
function doSearch(){
  const q=norm(sq.value); sSel=-1; sResults=[];
  $('#searchbar').classList.toggle('has',!!sq.value);
  if(!q){ sres.innerHTML=`<button class="s-all" data-kind="all"><span>Parcourir tous les pays</span><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>`; sres.classList.add('open'); return; }
  const cs=COUNTRY_KEYS.map(c=>({c,s:Math.min(scoreName(c.k,q),scoreName(c.ke,q))})).filter(x=>x.s<9).sort((a,b)=>a.s-b.s||a.c.i.n.localeCompare(b.c.i.n,'fr')).slice(0,4);
  let ci=[];
  if(CITIES){ for(const c of CITIES){ const s=Math.min(scoreName(c.k,q),scoreName(c.kf,q)); if(s<9) ci.push({c,s}); }
    ci.sort((a,b)=>(a.s>1?2:a.s)-(b.s>1?2:b.s)||b.c.pop-a.c.pop); ci=ci.slice(0,7); }
  const vs=visitedSet(), ps=plannedSet();
  let h='';
  if(cs.length){ h+=`<div class="s-group">Pays</div>`; cs.forEach(({c})=>{ sResults.push({kind:'country',id:c.id});
    h+=`<button class="s-row" data-i="${sResults.length-1}"><span class="s-flag">${c.i.flag||''}</span><span class="s-main"><b>${hl(c.i.n,q)}</b><small>${esc(REG[c.i.reg]||c.i.reg||'')}</small></span><i class="dot ${ps.has(c.id)?'aqua':vs.has(c.id)?'gold':'grey'}"></i></button>`; }); }
  if(ci.length){ h+=`<div class="s-group">Villes</div>`; ci.forEach(({c})=>{ sResults.push({kind:'city',c}); const i=INFO[c.cid]||{};
    h+=`<button class="s-row" data-i="${sResults.length-1}"><span class="s-pin"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></span><span class="s-main"><b>${hl(c.fr||c.n,q)}</b><small>${i.flag||''} ${esc(i.n||'')}${c.pop?' · '+fmtPop(c.pop):''}</small></span></button>`; }); }
  if(!CITIES) h+=`<div class="s-note">Chargement des villes…</div>`;
  if(!cs.length && !ci.length && CITIES){
    h+= sampleCap? `<button class="s-row s-ai" data-kind="ai"><span class="s-pin"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"/></svg></span><span class="s-main"><b>Chercher « ${esc(sq.value.trim())} »</b><small>Localiser ce lieu avec Claude</small></span></button>` : `<div class="s-note">Aucun résultat</div>`;
  }
  sres.innerHTML=h; sres.classList.add('open');
}

const C={ocean0:'#0f1724',ocean1:'#070b12',land:'#1f2633',landLine:'rgba(237,230,214,0.07)',gold0:'#F6D58E',gold1:'#C98A2E',aqua:'#6FE3CF'};

  const vlist=state.visited.filter(id=>BY_ID[id]&&!ps.has(id));
  vlist.forEach((id,k)=>{
    const rt=Math.min(1,(now-Math.max(t0,revealAt-600))/introDur); const a=Math.max(0,Math.min(1,(rt*1.25-0.25-k/vlist.length*0.6)*4));

  });
  ctx.globalAlpha=Math.min(1,it*1.6);
  // planned: aqua pulse
  const pulse=0.5+0.5*Math.sin(now/520);
  ps.forEach(id=>{ const f=BY_ID[id]; if(!f) return; ctx.beginPath(); path(f); ctx.fillStyle=`rgba(111,227,207,${0.55+0.3*pulse})`; ctx.fill(); ctx.strokeStyle=vs.has(id)?C.gold0:'rgba(220,255,250,0.7)'; ctx.lineWidth=0.9; ctx.stroke(); });

  ctx.strokeStyle='rgba(227,181,99,0.25)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke();
  // tiny countries markers
  FEATS.forEach(f=>{ if(!f.tiny) return; const v=vs.has(f.id), p=ps.has(f.id); if(!v&&!p) return; if(d3.geoDistance(f.cent,cLL)>Math.PI/2.1) return; const q=proj(f.cent);
    ctx.beginPath(); ctx.arc(q[0],q[1],2.6,0,7); ctx.fillStyle=p?C.aqua:C.gold0; ctx.fill();
    ctx.beginPath(); ctx.arc(q[0],q[1],5.5+pulse*1.5,0,7); ctx.strokeStyle=p?'rgba(111,227,207,.5)':'rgba(246,213,142,.45)'; ctx.lineWidth=1; ctx.stroke(); });
  // selected pop
  if(selected && BY_ID[selected]){
    const f=BY_ID[selected]; const raw=Math.max(0,Math.min(1,(now-popStart)/650)); const e=raw<1?d3.easeBackOut.overshoot(2.2)(raw):1;
    if(d3.geoDistance(f.cent,cLL)<Math.PI/2){

      ctx.beginPath(); path(f); const {v,p}=statusOf(selected);

      ctx.shadowColor=p?'rgba(111,227,207,0.9)':'rgba(246,213,142,0.9)'; ctx.shadowBlur=18*e; ctx.shadowOffsetY=0;
      ctx.strokeStyle='#FFF6E3'; ctx.lineWidth=1.4/s; ctx.stroke();
      ctx.restore();
      if(f.tiny){ ctx.beginPath(); ctx.arc(q[0],q[1]-6*e,10+12*e,0,7); ctx.strokeStyle=`rgba(255,246,227,${0.6*e})`; ctx.lineWidth=1.2; ctx.stroke(); }
      // unlock burst

    }
  }
  // routes (above the popped country)
  labelBoxes=[]; state.trips.forEach(t=>drawRoute(t,now,cLL,cx,cy,ui.trip?t.id===ui.trip:t.country===selected));
  // searched city marker
  if(cityMark && d3.geoDistance([cityMark.lon,cityMark.lat],cLL)<Math.PI/2){
    const q=proj([cityMark.lon,cityMark.lat]); const age=now-cityMark.t0; const e=Math.max(0,Math.min(1,age/500));
    if(e>0){
      for(let r=0;r<2;r++){ const ph=((age/1700)+r*0.5)%1; ctx.beginPath(); ctx.arc(q[0],q[1],6+ph*30,0,7); ctx.strokeStyle=`rgba(255,246,227,${(1-ph)*0.7*e})`; ctx.lineWidth=1.3; ctx.stroke(); }
      const lift=(1-d3.easeBackOut(e))*-18; ctx.save(); ctx.translate(0,lift);
      ctx.beginPath(); ctx.arc(q[0],q[1],5.5*e,0,7); ctx.fillStyle='#FFF6E3'; ctx.shadowColor='rgba(246,213,142,.9)'; ctx.shadowBlur=14; ctx.fill(); ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(q[0],q[1],2.2*e,0,7); ctx.fillStyle='#C98A2E'; ctx.fill();
      ctx.globalAlpha=e; ctx.font='700 12px Manrope, system-ui, sans-serif'; const lab=cityMark.name; const w=ctx.measureText(lab).width;
      roundRect(q[0]-w/2-10,q[1]-36,w+20,22,11); ctx.fillStyle='rgba(12,16,24,0.92)'; ctx.fill(); ctx.strokeStyle='rgba(246,213,142,0.55)'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='#FFF6E3'; ctx.textAlign='center'; ctx.fillText(lab,q[0],q[1]-21); ctx.textAlign='left'; ctx.restore(); ctx.globalAlpha=Math.min(1,it*1.6);
    }
  }

  if(d3.geoDistance([HOME.lon,HOME.lat],cLL)<Math.PI/2){ const q=proj([HOME.lon,HOME.lat]); ctx.beginPath(); ctx.arc(q[0],q[1],2.2,0,7); ctx.fillStyle='#FFF6E3'; ctx.fill(); }
  ctx.globalAlpha=1;
}
let labelBoxes=[];
function liftPt(ll,h,cx,cy){ const p=proj(ll); return [cx+(p[0]-cx)*(1+h), cy+(p[1]-cy)*(1+h)]; }
function drawRoute(t,now,cLL,cx,cy,active){
  if(!t.stops.length) return;
  const pts=[[HOME.lon,HOME.lat],...t.stops.map(s=>[s.lon,s.lat])];
  ctx.save();
  for(let s=0;s<pts.length-1;s++){
    const a=pts[s], b=pts[s+1]; const dist=d3.geoDistance(a,b); if(dist<1e-5) continue;
    const ip=d3.geoInterpolate(a,b); const alt=Math.min(0.22,dist*(s===0?0.45:0.3)); const N=Math.max(12,Math.ceil(dist*120));

    // glow + dashed
    for(const pass of [0,1]){
      ctx.beginPath(); let pen=false; seg.forEach(p=>{ if(!p){pen=false;return;} if(!pen){ctx.moveTo(p[0],p[1]);pen=true;} else ctx.lineTo(p[0],p[1]); });
      if(pass===0){ ctx.setLineDash([]); ctx.strokeStyle=active?'rgba(111,227,207,0.18)':'rgba(111,227,207,0.08)'; ctx.lineWidth=active?6:4; }
      else { ctx.setLineDash(s===0?[2,6]:[7,6]); ctx.lineDashOffset=-now*0.03; ctx.strokeStyle=active?'#BFF5EC':'rgba(191,245,236,0.6)'; ctx.lineWidth=active?1.6:1.1; }
      ctx.stroke();
      if(pass===1 && active && ui.trip===t.id && ui.activeStop===s){ ctx.setLineDash([]); ctx.strokeStyle='rgba(246,213,142,0.95)'; ctx.lineWidth=2.4; ctx.stroke(); }
    }
    // comet
    const u=((now/2400)+s*0.37)%1; const ci=Math.round(u*N); const cp=seg[ci];
    if(cp){ ctx.setLineDash([]); const gg=ctx.createRadialGradient(cp[0],cp[1],0,cp[0],cp[1],9); gg.addColorStop(0,'rgba(255,255,255,0.95)'); gg.addColorStop(0.3,'rgba(111,227,207,0.6)'); gg.addColorStop(1,'rgba(111,227,207,0)'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(cp[0],cp[1],9,0,7); ctx.fill(); }
  }
  ctx.setLineDash([]);
  t.stops.forEach((st,k)=>{ const ll=[st.lon,st.lat]; if(d3.geoDistance(ll,cLL)>Math.PI/2) return; const q=proj(ll);
    const on=active&&ui.trip===t.id&&ui.activeStop===k; if(on){ ctx.beginPath(); ctx.arc(q[0],q[1],9+3*Math.sin(now/300),0,7); ctx.strokeStyle='rgba(246,213,142,.7)'; ctx.lineWidth=1.4; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(q[0],q[1],active?4.5:3,0,7); ctx.fillStyle=on?'#F6D58E':'#07101a'; ctx.fill(); ctx.strokeStyle=C.aqua; ctx.lineWidth=1.6; ctx.stroke();
    if(active){ ctx.font='600 11px Manrope, system-ui, sans-serif'; const label=(k+1)+'  '+st.name; const w=ctx.measureText(label).width;
      const bx=[q[0]+8,q[1]-10,w+12,20]; if(labelBoxes.some(o=>bx[0]<o[0]+o[2]&&bx[0]+bx[2]>o[0]&&bx[1]<o[1]+o[3]&&bx[1]+bx[3]>o[1])) return; labelBoxes.push(bx);
      ctx.fillStyle='rgba(7,10,16,0.82)'; roundRect(q[0]+8,q[1]-10,w+12,20,10); ctx.fill(); ctx.strokeStyle='rgba(111,227,207,0.35)'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='#EDE6D6'; ctx.fillText(label,q[0]+14,q[1]+4); }
  });
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

renderHeader();
requestAnimationFrame(frame);
window.__globe={state,select,fitRoute};
})();
